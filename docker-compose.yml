services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blubird
      POSTGRES_PASSWORD: blubird
      POSTGRES_DB: fieldwren
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blubird -d fieldwren"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - fieldwren_pg:/var/lib/postgresql/data

volumes:
  fieldwren_pg:
